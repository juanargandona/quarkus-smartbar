openapi: 3.0.1
info:
  title: Title
  description: Title
  version: 1.0.0
servers:
  - url: 'https'
paths:
  /articles:
    get:
      operationId: getArticles
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/apiArticle"
          description: Get all articles
    post:
      operationId: createArticle
      parameters:
        - name: x-category-id
          in: header
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/apiArticle"
      responses:
        201:
          $ref: "#/components/responses/201"
  /articles/{articleId}:
    parameters:
      - name: articleId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/id"
    put:
      operationId: updateArticle
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/apiArticle"
      responses:
        200:
          $ref: "#/components/responses/updated"
    delete:
      operationId: deleteArticle
      responses:
        200:
          $ref: "#/components/responses/deleted"
    get:
      operationId: getArticle
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apiArticle"
          description: Entity retrieved successfully
  /categories:
    get:
      operationId: getCategories
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/apiCategory"
          description: Get all categories
    post:
      operationId: createCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/apiCategory"
      responses:
        201:
          $ref: "#/components/responses/201"
  /categories/{categoryId}:
    parameters:
      - name: categoryId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/id"
    put:
      operationId: updateCategory
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/apiCategory"
      responses:
        200:
          $ref: "#/components/responses/updated"
    delete:
      operationId: deleteCategory
      responses:
        200:
          $ref: "#/components/responses/deleted"
    get:
      operationId: getCategory
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apiCategory"
          description: Entity retrieved successfully
  /tables:
    get:
      operationId: getTables
      responses:
        200:
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/apiTable"
          description: Get all tables
    post:
      operationId: createTable
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/apiTable"
      responses:
        201:
          $ref: "#/components/responses/201"
  /tables/{tableId}:
    parameters:
      - name: tableId
        in: path
        required: true
        schema:
          $ref: "#/components/schemas/id"
    put:
      operationId: updateTable
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/apiTable"
      responses:
        200:
          $ref: "#/components/responses/updated"
    delete:
      operationId: deleteTable
      responses:
        200:
          $ref: "#/components/responses/deleted"
    get:
      operationId: getTable
      responses:
        200:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/apiTable"
          description: Entity retrieved successfully

components:
  schemas:
    apiArticle:
      type: object
      required:
        - name
        - price
        - picture
        - description
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        price:
          type: number
        description:
          type: string
        picture:
          type: string
    apiCategory:
      type: object
      required:
        - name
        - description
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
    apiTable:
      type: object
      required:
        - name
        - seatCount
        - active
      properties:
        name:
          type: string
        seatCount:
          type: integer
        active:
          type: boolean
    id:
      type: integer
      format: int64
  responses:
    updated:
      description: Entity updated successfully
    deleted:
      description: Entity deleted successfully
    201:
      description: Entity created successfully